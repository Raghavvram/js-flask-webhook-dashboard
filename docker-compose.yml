services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: analytics_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount initialization scripts
      - ./backend/table.sql:/docker-entrypoint-initdb.d/01-table.sql
      - ./backend/supabase_analytics_function.sql:/docker-entrypoint-initdb.d/02-function.sql

  backend:
    build: ./backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_NAME=analytics_db
      - DB_USER=postgres
      - DB_PASS=postgrespassword
      - DB_PORT=5432
      - PORT=5000
    depends_on:
      - db

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Pass any necessary env vars to frontend
      # Next.js uses NEXT_PUBLIC_ for client-side, but rewrite usually happens in next.config.js
      # Assuming frontend calls backend via relative path or proxy
      # For server-side rendering or API routes:
      - BACKEND_URL=http://backend:5000
    depends_on:
      - backend

volumes:
  postgres_data:
